name: macOS 27 validation

on:
  pull_request:
  push:
    branches: [develop, 'codex/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos27-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regressions:
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Run macOS 27 regressions
        run: bash scripts/test-macos27.sh

  build:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Verify toolchain
        run: |
          xcodebuild -version
          sdk_version=$(xcrun --sdk macosx --show-sdk-version)
          test "${sdk_version%%.*}" = 27
      - name: Install build tools
        run: |
          command -v carthage >/dev/null || brew install carthage
          command -v swiftlint >/dev/null || brew install swiftlint
      - name: Build PlayTools
        run: carthage update --use-xcframeworks --cache-builds
      - name: Build with ad hoc signing
        env:
          FASTLANE: '1'
        run: |
          xcodebuild -project PlayCover.xcodeproj -scheme PlayCover -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            PROVISIONING_PROFILE_SPECIFIER= build
