name: Bug report
description: Report a crash, incorrect behavior, or performance problem in the macOS 27 fork.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: checkboxes
    id: scope
    attributes:
      label: Before reporting
      options:
        - label: I am using this fork on macOS 27 and checked for an existing issue.
          required: true
  - type: input
    id: pc-version
    attributes:
      label: PlayCover version and build
      description: Copy the version and build from About PlayCover, or give the source commit for a local build.
      placeholder: 3.1.1 (857)
    validations:
      required: true
  - type: input
    id: mac-version
    attributes:
      label: macOS 27 version and build
      description: Run sw_vers in Terminal or copy the details from About This Mac.
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Mac chip and memory
      placeholder: M2 Pro, 16 GB
    validations:
      required: true
  - type: textarea
    id: describe-bug
    attributes:
      label: What happened?
      description: Include the exact error message or describe the slow operation and how long it takes.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include relevant settings and app versions so someone else can reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: expected-behaviour
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Attach relevant crash reports, logs, or screenshots. Remove personal information and private source URLs before posting.
