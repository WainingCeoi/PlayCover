name: Feature request
description: Suggest an improvement for the macOS 27 fork.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: related-to-problem
    attributes:
      label: What problem would this solve?
      description: Describe the task or experience you want to improve on macOS 27.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the behavior you would like and any alternatives you considered.
    validations:
      required: true
  - type: textarea
    id: extra-info
    attributes:
      label: Additional context
      description: Add relevant screenshots, examples, or links.
