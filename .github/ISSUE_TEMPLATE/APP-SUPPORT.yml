name: App or game compatibility
description: Report a specific iOS app or game that fails to install or work on macOS 27.
title: "[Compatibility]: "
labels: ["bug"]
body:
  - type: checkboxes
    id: scope
    attributes:
      label: Before reporting
      options:
        - label: I am using this fork on macOS 27 and checked for an existing issue.
          required: true
  - type: input
    id: app-store
    attributes:
      label: App or game name and App Store link
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App or game version
    validations:
      required: true
  - type: input
    id: pc-version
    attributes:
      label: PlayCover version and build
      description: Copy the version and build from About PlayCover, or give the source commit for a local build.
      placeholder: 3.1.1 (857)
    validations:
      required: true
  - type: input
    id: mac-version
    attributes:
      label: macOS 27 version and build
      description: Run sw_vers in Terminal or copy the details from About This Mac.
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Mac chip and memory
      placeholder: M2 Pro, 16 GB
    validations:
      required: true
  - type: checkboxes
    id: symptoms
    attributes:
      label: What fails?
      options:
        - label: Installation
        - label: Launch
        - label: Stability or performance during use
        - label: Graphics or window behavior
        - label: Keyboard, mouse, controller, or keymapping
        - label: Networking or in-app downloads
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce and expected behavior
      description: Include exact errors and any non-default app settings or keymaps. Describe what happened and what you expected.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Attach relevant crash reports, logs, or screenshots. Remove personal information and private source URLs before posting.
